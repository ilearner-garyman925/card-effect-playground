<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨夜巡察 · 人物控制點原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080f19;color:#e6f5fa;font:15px system-ui,sans-serif}main{min-height:100svh;display:flex;align-items:center;justify-content:center;gap:64px;padding:28px}aside{max-width:290px}small{color:#66d9ed;letter-spacing:3px}h1{font-size:36px;font-weight:500;margin:18px 0}p{color:#91a8b8;line-height:1.9}button{cursor:pointer;border:1px solid #385364;background:#102431;color:#d5faff;border-radius:6px;padding:12px 18px;font:inherit}button:hover{border-color:#67ddef}label{display:flex;gap:10px;padding:12px 0;align-items:center}input{accent-color:#68dff2}canvas{touch-action:none;display:block;width:100%;height:100%}.card{height:min(90svh,900px);aspect-ratio:896/1200;max-width:100%;overflow:hidden;border:1px solid #315065;border-radius:12px;box-shadow:0 20px 80px #0008}footer{margin-top:30px;font-size:12px;color:#607c90}@media(max-width:800px){main{flex-direction:column;padding:16px;gap:24px}.card{height:min(73svh,720px);width:auto;max-width:100%}aside{max-width:520px;width:100%}h1{font-size:26px}.controls{display:flex;flex-wrap:wrap;gap:16px}footer{margin-top:16px}}
</style><main><div class="card"><canvas id="scene" width="896" height="1200" aria-label="藍髮角色站在雨夜街道，藍色鎧甲光紋呼吸，空中載具懸浮"></canvas></div><aside><small>YUKI / NIGHT PATROL</small><h1>雨夜巡察</h1><p>雨落在霓虹之間。<br>人物分離 · 六秒待機循環</p><button id="pause">暫停動畫</button><div class="controls"><label><input id="motion" type="checkbox" checked>人物呼吸與點頭</label><label><input id="pins" type="checkbox">顯示控制點（可拖曳）</label><label><input id="solo" type="checkbox">只看去背人物</label><label>動作幅度 <input id="strength" type="range" min="0" max="2" step="0.1" value="1" aria-label="動作幅度"></label><label><input id="rain" type="checkbox" checked>雨與漣漪</label><label><input id="glow" type="checkbox" checked>鎧甲藍光</label><label><input id="hover" type="checkbox" checked>載具懸浮</label></div><button id="reset">重設姿勢</button><footer>透明人物＋獨立背景＋網格變形<br>綠色控制點可拖曳，金色腳底固定。</footer><p id="status" role="status"></p></aside></main>
